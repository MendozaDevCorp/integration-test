            background: #f5f7fa;
            color: #222;
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;

        h1 {
            margin-bottom: 5px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }

        .status {

<body>

    <div class="card">

        <h1>🧪 Integration Test</h1>

        <p>
            This page is used to validate third-party integrations.
        </p>

        <div class="status">

        </div>

            <strong>Build:</strong> July 21, 2026<br>
            <strong>Environment:</strong> GitHub Pages
        </div>

    </div>

    <script>

        function updateStatus(message, success = true) {

            const status = document.getElementById("status");

            status.innerHTML =
                `${success ? "🟢" : "🔴"} ${message}`;

            console.log(message);
        }
